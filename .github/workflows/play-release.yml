name: Play Release AAB

on:
  workflow_dispatch:
  push:
    branches:
      - 'play-rc/**'

permissions:
  contents: read

jobs:
  play-bundle:
    runs-on: ubuntu-latest
    environment: play-production
    env:
      SCENIC_API_BASE_URL: ${{ secrets.SCENIC_API_BASE_URL }}
      SCENIC_MAP_STYLE_URL: ${{ secrets.SCENIC_MAP_STYLE_URL }}
      SCENIC_PRIVACY_POLICY_URL: ${{ secrets.SCENIC_PRIVACY_POLICY_URL }}
      SCENIC_UPLOAD_STORE_FILE: /tmp/scenic-upload.jks
      SCENIC_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
      SCENIC_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
      SCENIC_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Backend release tests
        working-directory: backend
        run: npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Validate required Play secrets
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$PLAY_UPLOAD_KEYSTORE_BASE64" || { echo "PLAY_UPLOAD_KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$SCENIC_API_BASE_URL" || { echo "SCENIC_API_BASE_URL is missing"; exit 1; }
          test -n "$SCENIC_MAP_STYLE_URL" || { echo "SCENIC_MAP_STYLE_URL is missing"; exit 1; }
          test -n "$SCENIC_PRIVACY_POLICY_URL" || { echo "SCENIC_PRIVACY_POLICY_URL is missing"; exit 1; }
          test -n "$SCENIC_UPLOAD_STORE_PASSWORD" || { echo "PLAY_UPLOAD_STORE_PASSWORD is missing"; exit 1; }
          test -n "$SCENIC_UPLOAD_KEY_ALIAS" || { echo "PLAY_UPLOAD_KEY_ALIAS is missing"; exit 1; }
          test -n "$SCENIC_UPLOAD_KEY_PASSWORD" || { echo "PLAY_UPLOAD_KEY_PASSWORD is missing"; exit 1; }

      - name: Restore upload keystore
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$SCENIC_UPLOAD_STORE_FILE"
          chmod 600 "$SCENIC_UPLOAD_STORE_FILE"

      - name: Verify production release configuration
        run: gradle :app:verifyPlayReleaseConfig

      - name: Android routing unit tests
        run: gradle :app:testReleaseUnitTest

      - name: Release lint
        run: gradle :app:lintRelease

      - name: Build signed release AAB
        run: gradle :app:bundleRelease

      - name: Verify AAB signature
        run: |
          set -euo pipefail
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' -type f | head -n 1)
          test -n "$AAB"
          jarsigner -verify "$AAB"
          sha256sum "$AAB" | tee play-aab-sha256.txt

      - name: Upload signed Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: scenic-path-play-aab-rc
          path: |
            app/build/outputs/bundle/release/*.aab
            play-aab-sha256.txt
          if-no-files-found: error
