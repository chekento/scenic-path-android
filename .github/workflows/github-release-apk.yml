name: Publish installable APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-scenic-path-apk
  cancel-in-progress: false

jobs:
  publish-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Build installable debug APK
        run: gradle :app:assembleDebug

      - name: Prepare release asset
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          cp "$APK" Scenic-Path-v0.6.2-rc1-debug.apk
          sha256sum Scenic-Path-v0.6.2-rc1-debug.apk > Scenic-Path-v0.6.2-rc1-debug.apk.sha256

      - name: Publish GitHub release and APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.6.2-rc1"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Scenic Path v0.6.2-rc1" \
              --prerelease \
              --notes "Installable Scenic Path Android test APK. Package: cloud.kosch.scenicpath. This is an RC/debug build for testing before Play Store production signing."
          fi
          gh release upload "$TAG" \
            Scenic-Path-v0.6.2-rc1-debug.apk \
            Scenic-Path-v0.6.2-rc1-debug.apk.sha256 \
            --clobber

      - name: Keep workflow artifact too
        uses: actions/upload-artifact@v4
        with:
          name: Scenic-Path-v0.6.2-rc1-debug-apk
          path: |
            Scenic-Path-v0.6.2-rc1-debug.apk
            Scenic-Path-v0.6.2-rc1-debug.apk.sha256
