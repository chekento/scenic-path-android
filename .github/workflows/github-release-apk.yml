name: Publish installable APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-scenic-path-apk
  cancel-in-progress: false

jobs:
  publish-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Scenic Path brand contract
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/frontpage/scenic-path-logo.webp
          test -s assets/frontpage/scenic-path-icon.png
          test -s app/src/main/res/drawable-nodpi/scenic_path_app_icon.png
          test -s app/src/main/res/drawable/ic_launcher_foreground.xml
          cmp assets/frontpage/scenic-path-icon.png app/src/main/res/drawable-nodpi/scenic_path_app_icon.png
          grep -q 'scenic_path_app_icon' app/src/main/res/drawable/ic_launcher_foreground.xml
          grep -q 'android:icon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' app/src/main/AndroidManifest.xml
          grep -q 'android:logo="@drawable/ic_launcher_foreground"' app/src/main/AndroidManifest.xml
          grep -q '@drawable/ic_launcher_foreground' app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q '@drawable/ic_launcher_foreground' app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Verify original search algorithm contract
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/java/cloud/kosch/scenicpath/OriginalSearchStack.kt
          test -s app/src/main/java/cloud/kosch/scenicpath/OsmPlaceSearch.kt
          test -s app/src/main/java/cloud/kosch/scenicpath/OsmAddressSearch.kt
          test -s app/src/main/java/cloud/kosch/scenicpath/FastRoutePoiDiscovery.kt
          test -s app/src/main/java/cloud/kosch/scenicpath/RapidRoutePoiDiscovery.kt
          test -s app/src/main/java/cloud/kosch/scenicpath/PrecisionRoutePoiDiscovery.kt
          test -s app/src/main/java/cloud/kosch/scenicpath/RoutePoiCoverageDiscovery.kt
          grep -q 'OsmPlaceSearch.search' app/src/main/java/cloud/kosch/scenicpath/OriginalSearchStack.kt
          grep -q 'OsmAddressSearch.search' app/src/main/java/cloud/kosch/scenicpath/OriginalSearchStack.kt
          grep -q 'OriginalSearchStack.search' app/src/main/java/cloud/kosch/scenicpath/PlacePickerSheet.kt
          grep -q 'RapidRoutePoiDiscovery.discover' app/src/main/java/cloud/kosch/scenicpath/ScenicMap.kt
          grep -q 'FastRoutePoiDiscovery.discover' app/src/main/java/cloud/kosch/scenicpath/ScenicMap.kt
          grep -q 'PrecisionRoutePoiDiscovery.discover' app/src/main/java/cloud/kosch/scenicpath/ScenicMap.kt

      - name: Decode brand images
        run: |
          python -m pip install Pillow
          python -c "from PIL import Image; im = Image.open('assets/frontpage/scenic-path-icon.png'); im.load(); assert im.width == im.height; print(im.size)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Unit tests
        run: gradle :app:testDebugUnitTest

      - name: Android lint
        run: gradle :app:lintRelease

      - name: Resolve app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=Scenic-Path-v$VERSION-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Build installable debug APK
        run: gradle :app:assembleDebug

      - name: Prepare release asset
        shell: bash
        env:
          OUT_APK: ${{ steps.version.outputs.apk }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          cp "$APK" "$OUT_APK"
          sha256sum "$OUT_APK" > "$OUT_APK.sha256"

      - name: Publish GitHub release and APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          OUT_APK: ${{ steps.version.outputs.apk }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Scenic Path v$VERSION" \
              --prerelease \
              --notes-file CHANGELOG.md
          fi
          gh release upload "$TAG" \
            "$OUT_APK" \
            "$OUT_APK.sha256" \
            --clobber

      - name: Keep workflow artifact too
        uses: actions/upload-artifact@v4
        with:
          name: Scenic-Path-${{ steps.version.outputs.version }}-debug-apk
          path: |
            ${{ steps.version.outputs.apk }}
            ${{ steps.version.outputs.apk }}.sha256
